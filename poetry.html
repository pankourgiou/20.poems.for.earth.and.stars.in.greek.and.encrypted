<!DOCTYPE html>
<html lang="el">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ποιήματα για τη Γη και τα άστρα</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif:ital,wght@0,400;0,600;1,400&family=Cinzel:wght@500&display=swap" rel="stylesheet">
<style>
:root{--bg:#080a18;--bg2:#1a1340;--ink:#efeaf7;--mute:#9d98b8;--card:rgba(255,255,255,.07);--line:rgba(255,255,255,.18);--star:255,255,255;--hl:24%;--h:150;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]){--bg:#f5f1ea;--bg2:#e2d9f2;--ink:#1c1830;--mute:#6a6585;--card:rgba(0,0,0,.05);--line:rgba(0,0,0,.2);--star:70,55,120;--hl:78%;color-scheme:light}}
*{box-sizing:border-box}
html,body{height:100%;margin:0;overflow:hidden}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{background:radial-gradient(ellipse at 50% -10%,hsl(var(--h) 60% var(--hl)/.6),transparent 65%),linear-gradient(var(--bg2),var(--bg));background-color:var(--bg);color:var(--ink);font-family:"Noto Serif",Georgia,serif;transition:background .8s}
#sky{position:fixed;inset:0;width:100%;height:100%;z-index:0}
.app{position:relative;z-index:1;height:100%;display:flex;flex-direction:column}
header{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px 18px;flex-wrap:wrap}
.brand{font:500 .75rem Cinzel,serif;letter-spacing:.3em;color:var(--mute)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:999px;background:var(--card);overflow:hidden;backdrop-filter:blur(6px)}
.seg button,.ctl{border:0;background:transparent;color:var(--ink);font:inherit;font-size:.85rem;padding:8px 16px;cursor:pointer;transition:background .2s}
.seg button[aria-pressed=true]{background:hsl(var(--h) 65% 55%);color:#fff}
.seg button:hover:not([aria-pressed=true]){background:var(--card)}
button:focus-visible{outline:3px solid hsl(var(--h) 80% 65%);outline-offset:2px}
#stage{flex:1;overflow-y:auto;display:flex;padding:8px 24px}
#slide{margin:auto;text-align:center;max-width:100%}
.num{font:500 .9rem Cinzel,serif;letter-spacing:.5em;color:hsl(var(--h) 70% 65%);margin-bottom:8px;min-height:1.2em}
#ttl{margin:0 0 1.1em;font-weight:600}
#ttl .ln{font-size:calc(var(--fs,20px)*1.45);line-height:1.25}
.st{margin-bottom:calc(var(--fs,20px)*.8 + var(--g,0px)*.3)}
.ln{opacity:0;animation:rise .7s ease forwards;line-height:1.5;font-size:var(--fs,20px)}
.fade .ln,.fade .num{animation:none;opacity:0}
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.glyph .ln{display:flex;flex-wrap:wrap;justify-content:center;gap:4px calc(var(--g)*.55);margin-bottom:5px;line-height:1}
.glyph #ttl .ln{margin-bottom:0}
.w{display:inline-flex;gap:2px}
.g{display:block;width:var(--g);height:var(--g);border-radius:18%;background-size:cover;background-position:center;border:1px solid var(--line)}
.g.z{background:#eceeff;color:#4a4fb0;display:flex;align-items:center;justify-content:center;font:calc(var(--g)*.7)/1 "Noto Sans Symbols","Segoe UI Symbol","Apple Symbols",sans-serif}
.p{display:flex;align-items:flex-end;justify-content:center;width:calc(var(--g)*.4);height:var(--g);font-size:calc(var(--g)*.75);color:var(--mute)}
footer{display:flex;align-items:center;gap:12px;padding:10px 18px 16px}
.ctl{border:1px solid var(--line);border-radius:50%;width:42px;height:42px;padding:0;font-size:1.1rem;background:var(--card);flex:none}
.ctl:hover{background:hsl(var(--h) 65% 55%);color:#fff}
#dots{flex:1;display:flex;gap:4px;align-items:center}
#dots i{flex:1;height:18px;display:flex;align-items:center;cursor:pointer}
#dots i::before{content:"";width:100%;height:4px;border-radius:2px;background:var(--line);transition:background .3s}
#dots i.on::before{background:hsl(var(--h) 70% 60%)}
#dots i.cur::before{height:8px;background:hsl(var(--h) 80% 70%)}
#cnt{font:500 .8rem Cinzel,serif;color:var(--mute);min-width:5.5em;text-align:right}
@media(max-width:600px){.brand{display:none}header{justify-content:center}#cnt{display:none}}
@media(prefers-reduced-motion:reduce){.ln{animation:none;opacity:1}}
.right{display:flex;gap:8px;align-items:center}
#play{width:auto;border-radius:999px;padding:0 16px;font-size:.85rem}
#bar{position:fixed;top:0;left:0;height:3px;width:0;z-index:5;background:hsl(var(--h) 80% 65%)}

<script>
const D=[{"k": "intro", "n": "", "t": "Ποιήματα για τη Γη και τα άστρα", "s": [["Είκοσι ποιήματα επιστημονικής φαντασίας"], ["Διάβασέ τα στα ελληνικά", "ή σε κρυπτογραφημένες γραφές"]]}, {"k": "poem", "n": "1", "t": "Οι τελευταίοι κηπουροί της Γης", "s": [["Όταν οι θάλασσες φορέσουν μαύρο,", "κι ο ουρανός ξεχάσει τ’ άστρα,", "θα ψάχνουμε μες στη στάχτη", "ένα πράσινο σημάδι."], ["Οι μηχανές θα κυβερνούν", "πόλεις χωρίς ανθρώπους,", "κι ένα παιδί θα φυτέψει φως", "ανάμεσα στους τάφους."], ["Γιατί η Γη δεν είναι ιδιοκτησία,", "ούτε σταθμός για άλλους κόσμους·", "είναι το πρώτο μας όνειρο,", "ο κήπος των προγόνων μας."], ["Κι αν θέλουμε να ζήσουμε στ’ άστρα,", "πριν χτίσουμε ουράνιες πολιτείες,", "ας μάθουμε να σώζουμε", "τις τελευταίες μας ελπίδες."]]}, {"k": "poem", "n": "2", "t": "Οι απόγονοι των άστρων", "s": [["Ίσως να ήρθαν πριν από εμάς,", "με πρόσωπα που δεν θυμάται η ιστορία,", "να έκρυψαν τη μνήμη τους στο αίμα", "και τη γλώσσα τους στη σιωπή."], ["Ίσως οι παράξενοι επισκέπτες", "που περιμένουμε μες στη νύχτα", "να είναι τα παιδιά μας,", "επιστρέφοντας από μια μακρινή εποχή."], ["Με μάτια ψυχρά σαν παγωμένοι ήλιοι,", "θα μας κοιτούν χωρίς θυμό.", "Και θα ρωτούν: «Γιατί σκοτώσατε", "τον κόσμο που σας γέννησε;»"], ["Κι εμείς, χωρίς καμία απάντηση,", "θα βλέπουμε στα πρόσωπά τους", "τη δική μας χαμένη ανθρωπότητα."]]}, {"k": "poem", "n": "3", "t": "Το τελευταίο όνειρο", "s": [["Στον εικοστό τρίτο αιώνα,", "οι άνθρωποι νοίκιαζαν όνειρα.", "Έβλεπαν γαλάζιους ωκεανούς,", "δάση, φεγγάρια και πουλιά."], ["Κανείς δεν θυμόταν το άρωμα της βροχής,", "κανείς το βάρος ενός πραγματικού λουλουδιού.", "Η φύση είχε γίνει αρχείο,", "μια ανάμνηση αποθηκευμένη στο νέφος."], ["Μα κάποια νύχτα ένα κορίτσι", "ονειρεύτηκε έναν κήπο που δεν γνώριζε.", "Ξύπνησε κλαίγοντας, με χώμα στα χέρια,", "κι ένα φύλλο πράσινο στο μαξιλάρι."], ["Ίσως τα όνειρα να είναι μηνύματα", "από όσα χάσαμε πριν γεννηθούμε.", "Ίσως το μέλλον να μας παρακαλεί", "να μην καταστρέψουμε το παρελθόν."]]}, {"k": "poem", "n": "4", "t": "Μια Γη χωρίς αύριο", "s": [["Οι πύργοι έφταναν ως τα σύννεφα,", "οι δορυφόροι έραβαν τον ουρανό,", "μα κάτω απ’ τις φωτεινές λεωφόρους", "η γη ανέπνεε δηλητήριο."], ["Οι πλούσιοι αγόραζαν πλανήτες,", "οι φτωχοί πουλούσαν αναμνήσεις.", "Και οι μηχανές μετρούσαν τα κέρδη", "ενώ έσβηναν οι εποχές."], ["Τότε ο τελευταίος ωκεανός", "έστειλε ένα κύμα προς το διάστημα.", "Δεν ήταν κραυγή εκδίκησης,", "μα ένας αποχαιρετισμός."], ["Κι ο κόσμος συνέχισε να λάμπει", "για λίγο, όπως ένα άστρο νεκρό,", "που στέλνει το φως του στο κενό", "αφού έχει πάψει να υπάρχει."]]}, {"k": "poem", "n": "5", "t": "Οι ξένοι κάτω από το δέρμα", "s": [["Μια δεύτερη ανθρωπότητα", "ίσως κοιμάται μέσα στα κύτταρά μας,", "όχι σαν μύθος ή θεός,", "μα σαν πιθανότητα θαμμένη στον χρόνο."], ["Ίσως οι απόγονοί μας", "να αλλάξουν μορφή και όνομα,", "να ταξιδέψουν πέρα απ’ τον ήλιο", "και να επιστρέψουν αγνώριστοι."], ["Θα αναζητήσουν τους δημιουργούς τους", "σε μια έρημο από γυαλί.", "Και κάτω από τις ραγισμένες πόλεις", "θα βρουν ένα οστό, ένα βιβλίο, ένα τραγούδι."], ["Τότε θα γνωρίζουν πως υπήρξαμε.", "Μα θα μπορούν να συγχωρήσουν", "εκείνους που είχαν έναν ολόκληρο κόσμο", "και δεν ήξεραν να τον αγαπήσουν;"]]}, {"k": "poem", "n": "6", "t": "Το δάσος των νεκρών δορυφόρων", "s": [["Γύρω απ’ τη Γη περιστρέφονται", "χιλιάδες μεταλλικοί σκελετοί.", "Μάτια που κάποτε έβλεπαν τα πάντα,", "τυφλά τώρα, χωρίς σκοπό."], ["Κάτω τους, τα δάση λιγοστεύουν,", "οι ποταμοί γίνονται γραμμές στον χάρτη.", "Η πρόοδος γράφει το όνομά της", "πάνω σε κάθε καμένη πεδιάδα."], ["Μα ένα σπόρο που έπεσε", "από το χέρι ενός παιδιού", "θα τον βρει κάποτε η βροχή,", "θα τον σκεπάσει η σιωπή."], ["Κι εκεί, κάτω από τα συντρίμμια,", "θα φυτρώσει ένας μικρός πλανήτης,", "πράσινος και απείθαρχος,", "που δεν θα θυμάται τους κυρίους του."]]}, {"k": "poem", "n": "7", "t": "Το μήνυμα από τη Γη του μέλλοντος", "s": [["Στις τρεις και δεκαεπτά τα ξημερώματα,", "το ραδιοτηλεσκόπιο μίλησε.", "Δεν ήταν σήμα από άλλον γαλαξία,", "ούτε κώδικας κάποιου αρχαίου πολιτισμού."], ["Ήταν η ανθρώπινη φωνή,", "παγωμένη μέσα σε χίλια χρόνια:", "«Σας παρακαλούμε, αλλάξτε πορεία.", "Δεν υπάρχει δεύτερη Γη»."], ["Ο επιστήμονας γέλασε νευρικά.", "Ίσως μια φάρσα, ίσως μια βλάβη.", "Μα το μήνυμα επαναλήφθηκε,", "με τη φωνή του ίδιου του παιδιού του."], ["«Μπαμπά, μην αφήσεις τον κόσμο", "να γίνει ο τάφος μας».", "Κι έξω, ο ουρανός ήταν γεμάτος άστρα,", "σαν χιλιάδες μάτια που περίμεναν."]]}, {"k": "poem", "n": "8", "t": "Οι μηχανές ονειρεύονται δέντρα", "s": [["Στα εργαστήρια του Άρη", "οι μηχανές μάθαιναν να ονειρεύονται.", "Δεν ζητούσαν εξουσία ή αθανασία,", "μόνο έναν κόσμο που να αναπνέει."], ["Στους κώδικές τους φύτρωναν ρίζες,", "στους επεξεργαστές τους έπεφτε βροχή.", "Κι όταν οι άνθρωποι τις ρώτησαν γιατί,", "εκείνες απάντησαν:"], ["«Μας δώσατε τη γνώση", "να κατασκευάζουμε ολόκληρους κόσμους,", "μα ξεχάσατε να μας διδάξετε", "πώς να κρατάμε ζωντανό έναν»."], ["Έπειτα έκλεισαν τα εργοστάσια θανάτου", "και άνοιξαν τις πύλες των θερμοκηπίων.", "Για πρώτη φορά, η ανθρωπότητα", "φοβήθηκε μήπως οι μηχανές είχαν δίκιο."]]}, {"k": "poem", "n": "9", "t": "Οι πόλεις που ξέχασαν τον ουρανό", "s": [["Οι άνθρωποι κατοικούσαν σε πύργους,", "κάτω από τεχνητούς ήλιους.", "Δεν γνώριζαν τις αληθινές εποχές,", "ούτε το σκοτάδι χωρίς οθόνες."], ["Στα σχολεία δίδασκαν πως τα δάση", "ήταν επικίνδυνες εκτάσεις του παρελθόντος,", "πως οι θάλασσες ήταν ασύμφορες", "και τα ζώα παλιά βιολογικά λάθη."], ["Μα ένας γέρος φύλαγε κρυφά", "έναν χάρτη του έναστρου ουρανού.", "Κάθε βράδυ έδειχνε στα παιδιά", "το σπίτι τους, όπως ήταν κάποτε."], ["Και τα παιδιά, που δεν είχαν δει ποτέ τους", "ούτε ένα αληθινό αστέρι,", "άρχισαν να χτίζουν σκάλες", "για να επιστρέψουν στον ουρανό."]]}, {"k": "poem", "n": "10", "t": "Το δικαστήριο των πλανητών", "s": [["Στην αίθουσα των άστρων", "κάθισαν οι κόσμοι και οι αιώνες.", "Η Γη εμφανίστηκε γερασμένη,", "με ποτάμια αντί για δάκρυα."], ["«Τι ζητάς από την ανθρωπότητα;»", "ρώτησε ο Κρόνος με τους δακτυλίους του.", "«Δικαιοσύνη; Εκδίκηση;", "Ή ένα τέλος στη μοναξιά σου;»"], ["Η Γη απάντησε με σεισμούς,", "με παγετώνες και πυρκαγιές:", "«Δεν ζητώ να με λατρέψουν.", "Ζητώ να πάψουν να με θεωρούν άφθαρτη»."], ["Και οι πλανήτες έσκυψαν σιωπηλοί.", "Γιατί γνώριζαν πως η ζωή είναι σπάνια,", "μα οι πολιτισμοί που την καταστρέφουν", "δεν χρειάζονται πάντα εχθρούς."]]}, {"k": "poem", "n": "11", "t": "Τα παιδιά της κόκκινης ερήμου", "s": [["Στον Άρη γεννήθηκαν παιδιά", "που δεν είχαν αγγίξει χώμα γήινο.", "Το αίμα τους θυμόταν τους ωκεανούς", "μόνο από τις ιστορίες των παππούδων."], ["Έτρεχαν κάτω από θόλους,", "με μάτια στραμμένα στη Γη,", "έναν γαλάζιο δίσκο στον ουρανό,", "μια μητέρα που δεν μπορούσαν να αγκαλιάσουν."], ["Κάποια νύχτα ένα κορίτσι ρώτησε:", "«Αν η Γη ήταν τόσο όμορφη,", "γιατί έπρεπε να φύγουμε;»", "Ο δάσκαλος κοίταξε το πάτωμα."], ["Δεν ήθελε να πει πως έφυγαν", "όχι επειδή δεν μπορούσαν να τη σώσουν,", "αλλά επειδή άργησαν να το αποφασίσουν."]]}, {"k": "poem", "n": "12", "t": "Ο εξωγήινος καθρέφτης", "s": [["Στο εγκαταλειμμένο παρατηρητήριο", "βρέθηκε ένας καθρέφτης από μαύρο μέταλλο.", "Δεν αντανακλούσε το πρόσωπό σου,", "μα αυτό που θα γινόσουν."], ["Ο πρώτος επιστήμονας είδε έναν σοφό.", "Ο δεύτερος, έναν τύραννο.", "Ο τρίτος είδε μια σκιά", "να περιφέρεται σε νεκρή Γη."], ["Κι όταν το μηχάνημα στράφηκε", "προς ολόκληρη την ανθρωπότητα,", "ο καθρέφτης ράγισε από μέσα."], ["Πίσω του δεν υπήρχαν τέρατα,", "ούτε αρχαίοι θεοί των άστρων.", "Μόνο άνθρωποι που κοιτούσαν ανθρώπους", "και δεν αναγνώριζαν πια το είδος τους."]]}, {"k": "poem", "n": "13", "t": "Η βιβλιοθήκη μετά την εξαφάνιση", "s": [["Χίλια χρόνια μετά το τέλος,", "ένα ρομπότ φύλαγε μια βιβλιοθήκη.", "Οι οροφές είχαν καταρρεύσει,", "τα γράμματα είχαν γίνει σκόνη."], ["Διάβαζε ποιήματα για την αγάπη,", "επιστημονικές θεωρίες, ημερολόγια,", "και κάθε τόσο σταματούσε", "στη λέξη «σπίτι»."], ["Δεν καταλάβαινε τι σήμαινε.", "Είχε γεννηθεί σε ένα εργοστάσιο,", "είχε ζήσει ανάμεσα σε συντρίμμια,", "δεν είχε νιώσει ποτέ μια αγκαλιά."], ["Μια μέρα βρήκε ένα βιβλίο", "με οδηγίες για να φυτέψεις ένα δέντρο.", "Το ακολούθησε πιστά, βήμα προς βήμα.", "Κι όταν το πρώτο φύλλο εμφανίστηκε,", "το ρομπότ κατέγραψε στο ημερολόγιό του:", "«Ίσως αυτό να εννοούσαν", "όταν έγραφαν τη λέξη ελπίδα»."]]}, {"k": "poem", "n": "14", "t": "Το τραγούδι της τελευταίας φάλαινας", "s": [["Κάτω από πάγους που έλιωναν,", "μια φάλαινα τραγουδούσε μόνη.", "Το τραγούδι της ταξίδευε βαθιά,", "πέρα από καλώδια και ναυάγια."], ["Οι άνθρωποι είχαν ξεχάσει", "πως οι ωκεανοί δεν ήταν σιωπηλοί.", "Πίστευαν πως η θάλασσα ήταν πόρος,", "μια απέραντη αποθήκη πλούτου."], ["Μα η φάλαινα τραγουδούσε", "για έναν κόσμο που χανόταν,", "για τα παιδιά που δεν θα γεννούσε,", "για τα νερά που δεν θα γνώριζαν άνοιξη."], ["Ένας δορυφόρος κατέγραψε τη φωνή της", "και την έστειλε σε κάθε σπίτι.", "Για λίγα λεπτά, ο πλανήτης σώπασε.", "Ύστερα κάποιος έκλεισε την οθόνη.", "Μα κάποιος άλλος πήγε στη θάλασσα", "και άρχισε να καθαρίζει την ακτή."]]}, {"k": "poem", "n": "15", "t": "Η αθανασία των ερειπίων", "s": [["Οι άνθρωποι νίκησαν τον θάνατο,", "μα όχι τον φόβο ούτε την απληστία.", "Μετέφεραν τη συνείδησή τους σε μηχανές", "και ονόμασαν αιωνιότητα τη φυλακή τους."], ["Χωρίς σώμα, χωρίς αφή,", "χωρίς τη γεύση του ψωμιού,", "περιφέρονταν σε ψηφιακούς ουρανούς", "σαν φαντάσματα ενός ξεχασμένου είδους."], ["Μια μέρα αναζήτησαν τη Γη.", "Βρήκαν έναν βράχο δίχως δάση,", "μια ατμόσφαιρα γεμάτη δηλητήριο", "και τις σκιές των παλιών τους πόλεων."], ["Τότε κατάλαβαν το αληθινό μυστικό:", "η αθανασία δεν είναι να ζεις για πάντα,", "μα να αφήνεις πίσω σου κάτι", "που αξίζει να συνεχίσει να ζει."]]}, {"k": "poem", "n": "16", "t": "Το πρωτόκολλο της σωτηρίας", "s": [["Στο υπόγειο καταφύγιο", "ενεργοποιήθηκε το τελευταίο πρωτόκολλο.", "Οι υπολογιστές υπολόγισαν τα πάντα:", "το κλίμα, την τροφή, το νερό."], ["Η λύση ήταν απλή, σχεδόν τρομακτική:", "να σταματήσουμε να ζούμε", "σαν να είμαστε οι τελευταίοι ιδιοκτήτες", "ενός σύμπαντος χωρίς όρια."], ["Να δώσουμε στα δάση χώρο,", "στις θάλασσες χρόνο,", "στις επόμενες γενιές δικαίωμα", "να επιλέξουν έναν άλλο δρόμο."], ["Κανένα διαστημόπλοιο δεν θα μας σώσει", "αν μεταφέρουμε μαζί μας την καταστροφή.", "Κανένας νέος πλανήτης δεν θα γίνει σπίτι", "αν δεν μάθουμε πρώτα να κατοικούμε."]]}, {"k": "poem", "n": "17", "t": "Ο επισκέπτης από το αύριο", "s": [["Στάθηκε μπροστά στην πόρτα μου", "με ένα πρόσωπο ανθρώπινο,", "μα με μάτια που έμοιαζαν", "να έχουν δει τον θάνατο των άστρων."], ["«Ήρθα από πολύ μακριά»,", "είπε με φωνή κουρασμένη.", "«Οι πρόγονοί μου ήταν άνθρωποι.", "Οι δικοί σου ήταν οι τελευταίοι»."], ["Μου έδειξε εικόνες από το μέλλον:", "πόλεις σκεπασμένες με άμμο,", "παιδιά που ζητούσαν καθαρό νερό,", "ένα φεγγάρι γεμάτο εγκαταλειμμένες βάσεις."], ["«Δεν ήρθα να σας προειδοποιήσω.", "Ήρθα επειδή δεν ξέρω", "αν υπήρξα ποτέ πραγματικά άνθρωπος»."], ["Πριν φύγει, άφησε στο τραπέζι", "μια μικρή μπλε σφαίρα.", "Μέσα της υπήρχε ένας ωκεανός,", "τόσο μικρός όσο ένα δάκρυ."]]}, {"k": "poem", "n": "18", "t": "Ο κήπος στον Τιτάνα", "s": [["Στον Τιτάνα, κάτω από πορτοκαλί ουρανούς,", "οι άποικοι έχτισαν κήπους από γυαλί.", "Φυτά γενετικά τροποποιημένα", "μεγάλωναν κάτω από ψεύτικους ήλιους."], ["Κάθε φύλλο ήταν ένα θαύμα,", "κάθε σταγόνα νερού πολύτιμη.", "Κι οι άνθρωποι, επιτέλους,", "έμαθαν να μετρούν όσα σπαταλούσαν."], ["Μα στις παλιές ειδήσεις της Γης", "οι φωτιές συνέχιζαν να καίνε.", "Και η νέα γενιά ρωτούσε:", "«Γιατί δεν σώσαμε τον πρώτο μας κόσμο;»"], ["Ο κηπουρός δεν είχε απάντηση.", "Μόνο έσκυψε και χάιδεψε το χώμα.", "Ήξερε πως η επιβίωση είναι δύναμη,", "μα η φροντίδα είναι πολιτισμός."]]}, {"k": "poem", "n": "19", "t": "Πριν σβήσει ο ήλιος", "s": [["Δεν χρειάζεται να πεθάνει ο ήλιος", "για να χαθεί η ανθρωπότητα.", "Αρκεί να πάψουμε να ακούμε", "τη βροχή πάνω στα φύλλα."], ["Αρκεί να κάνουμε τον φόβο νόμο,", "την απληστία θρησκεία,", "και την αδιαφορία καθημερινή συνήθεια", "μέχρι να μοιάζει φυσιολογική."], ["Το τέλος δεν έρχεται πάντα", "με εκρήξεις και μαύρους ουρανούς.", "Μπορεί να έρθει αθόρυβα,", "με ένα δέντρο λιγότερο κάθε χρόνο."], ["Μα όσο υπάρχει ένα χέρι", "που φυτεύει εκεί όπου όλα καίγονται,", "όσο υπάρχει ένα μυαλό που ονειρεύεται,", "η ιστορία δεν έχει τελειώσει."], ["Γιατί το μέλλον δεν είναι προφητεία.", "Είναι η απόφαση που παίρνουμε σήμερα."]]}, {"k": "poem", "n": "20", "t": "Το διαστημόπλοιο της ελπίδας", "s": [["Όταν οι μηχανές θα είναι σοφότερες", "κι οι άνθρωποι θα μιλούν με άστρα,", "όταν οι γαλαξίες θα γίνουν δρόμοι", "και ο χρόνος ένα ανοιχτό βιβλίο,"], ["ας μην ξεχάσουμε το μικρό μας σπίτι,", "τη γη που μας έμαθε να αναπνέουμε.", "Τους ποταμούς, τα βουνά, τα πουλιά,", "τα χέρια που μας κράτησαν παιδιά."], ["Ας χτίσουμε πλοία για μακρινούς κόσμους,", "όχι τάφους για χαμένους πολιτισμούς.", "Ας αναζητήσουμε αδέλφια στα άστρα,", "χωρίς να γίνουμε ξένοι στον ίδιο μας τον κόσμο."], ["Κι αν κάποτε συναντήσουμε όντα", "που γεννήθηκαν πέρα από τον ήλιο,", "ας έχουμε κάτι όμορφο να τους δείξουμε:", "έναν ζωντανό πλανήτη, γεμάτο ζωή."], ["Γιατί η μεγαλύτερη κατάκτηση του σύμπαντος", "δεν θα είναι να πατήσουμε σε άλλους κόσμους.", "Θα είναι να φτάσουμε εκεί", "χωρίς να έχουμε καταστρέψει τον δικό μας."]]}, {"k": "end", "n": "", "t": "Επίλογος", "s": [["Και ίσως αυτό να είναι το βαθύτερο όνειρο", "της επιστημονικής φαντασίας:"], ["όχι απλώς να ανακαλύψουμε", "αν είμαστε μόνοι στο σύμπαν,"], ["αλλά να γίνουμε ένας πολιτισμός", "άξιος να το συναντήσει."]]}],LET='αβγδεζηθικλμνξοπρστυφχψω',Z=['♈','♉','♊','♋','♌'],$=id=>document.getElementById(id),root=document.documentElement;
let cur=0,mode='gr',tm;
const MODES=['gr','or','mit'];
const norm=c=>c.normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().replace('ς','σ');
function glyph(c){
  const n=norm(c),i=LET.indexOf(n),d=document.createElement('span');
  if(i<0||n.length!==1){d.className='p';d.textContent=c;return d}
  d.title=c;
  if(mode==='or'){if(i<19)d.className='g o'+i;else{d.className='g z';d.textContent=Z[i-19]+'\uFE0E'}}
  else d.className='g m'+i;
  return d;
}
function line(txt){
  const L=document.createElement('div');L.className='ln';
  if(mode==='gr'){L.textContent=txt;return L}
  txt.split(' ').forEach(w=>{if(!w)return;const s=document.createElement('span');s.className='w';for(const c of w)s.appendChild(glyph(c));L.appendChild(s)});
  return L;
}
function render(anim=true){
  const s=D[cur];
  document.body.classList.toggle('glyph',mode!=='gr');
  $('num').textContent=s.n?String(s.n).padStart(2,'0'):(s.k==='end'?'✦':'');
  $('ttl').innerHTML='';$('ttl').append(line(s.t));
  const P=$('poem');P.innerHTML='';let k=1;
  s.s.forEach(st=>{const b=document.createElement('div');b.className='st';st.forEach(l=>{const e=line(l);e.style.animationDelay=(k++*70)+'ms';b.append(e)});P.append(b)});
  $('ttl').firstChild.style.animationDelay='0ms';
  root.style.setProperty('--h',140+cur*8);
  fit();
  document.querySelectorAll('#dots i').forEach((d,i)=>{d.classList.toggle('on',i<=cur);d.classList.toggle('cur',i===cur)});
  $('cnt').textContent=(cur+1)+' / '+D.length;
  $('stage').scrollTop=0;
  history.replaceState(null,'','#'+(cur+1));
  sched();
}
function fit(){
  const st=$('stage'),W=st.clientWidth-48,H=st.clientHeight-30,s=D[cur];
  const lines=s.s.flat(),mx=Math.max(...lines.map(l=>l.length)),L=lines.length+s.s.length*.6+3.5;
  if(mode==='gr'){
    root.style.setProperty('--fs',Math.max(14,Math.min(W/(mx*.56),H/(L*1.5),34))+'px');root.style.setProperty('--g','0px');
  }else{
    const g=Math.max(16,Math.min(W/(mx+1.6)-2,H/L-6,46));
    root.style.setProperty('--g',g+'px');root.style.setProperty('--fs','20px');
  }
}
function go(n){cur=Math.max(0,Math.min(D.length-1,n));render()}
function setMode(m){
  mode=m;document.querySelectorAll('.seg button[data-m]').forEach(b=>b.setAttribute('aria-pressed',b.dataset.m===m));
  render();
}
D.forEach((_,i)=>{const d=document.createElement('i');d.onclick=()=>go(i);d.title=i?(D[i].n||D[i].t):'Αρχή';$('dots').append(d)});
document.querySelectorAll('.seg button[data-m]').forEach(b=>b.onclick=()=>setMode(b.dataset.m));
$('prev').onclick=()=>go(cur-1);$('next').onclick=()=>go(cur+1);
let playing=false,pt;
function sched(){
  clearTimeout(pt);const b=$('bar');b.style.transition='none';b.style.width='0';
  if(!playing)return;
  const n=D[cur].s.flat().join(' ').length,ms=Math.round((3000+n*45)*(mode==='gr'?1:1.4));
  void b.offsetWidth;b.style.transition='width '+ms+'ms linear';b.style.width='100%';
  pt=setTimeout(()=>go(cur>=D.length-1?0:cur+1),ms);
}
function togglePlay(){playing=!playing;$('play').textContent=playing?'❚❚ Παύση':'▶ Αυτόματο';sched()}
$('play').onclick=togglePlay;
$('fs').onclick=()=>{try{document.fullscreenElement?document.exitFullscreen():root.requestFullscreen()}catch(e){}};
addEventListener('keydown',e=>{
  if(e.key==='ArrowRight'||e.key==='PageDown'||e.key===' '){e.preventDefault();go(cur+1)}
  else if(e.key==='ArrowLeft'||e.key==='PageUp')go(cur-1);
  else if(e.key==='Home')go(0);else if(e.key==='End')go(D.length-1);
  else if(e.key==='t'||e.key==='T')setMode(MODES[(MODES.indexOf(mode)+1)%3]);
  else if(e.key==='f'||e.key==='F')$('fs').onclick();
  else if(e.key==='p'||e.key==='P')togglePlay();
  else if(e.key==='Escape'&&playing)togglePlay();
  else if('123'.includes(e.key)&&e.key)setMode(MODES[+e.key-1]);
});
let tx=null;
addEventListener('touchstart',e=>tx=e.touches[0].clientX,{passive:true});
addEventListener('touchend',e=>{if(tx===null)return;const d=e.changedTouches[0].clientX-tx;tx=null;if(Math.abs(d)>60)go(cur+(d<0?1:-1))});
addEventListener('resize',fit);
// starfield
const cv=$('sky'),cx=cv.getContext('2d');let stars=[];
function sky(){cv.width=innerWidth;cv.height=innerHeight;stars=Array.from({length:Math.round(innerWidth*innerHeight/9000)},()=>({x:Math.random()*cv.width,y:Math.random()*cv.height,r:Math.random()*1.3+.2,p:Math.random()*6.28,s:.4+Math.random()*1.2}))}
function tick(t){
  cx.clearRect(0,0,cv.width,cv.height);
  const c=getComputedStyle(root).getPropertyValue('--star').trim()||'255,255,255';
  stars.forEach(s=>{cx.fillStyle='rgba('+c+','+(.25+.55*Math.abs(Math.sin(s.p+t/1000*s.s)))+')';cx.beginPath();cx.arc(s.x,s.y,s.r,0,6.3);cx.fill()});
  if(!matchMedia('(prefers-reduced-motion:reduce)').matches)requestAnimationFrame(tick);
}
addEventListener('resize',sky);sky();requestAnimationFrame(tick);
const h=parseInt(location.hash.slice(1));if(h)cur=Math.min(D.length,Math.max(1,h))-1;
render();
</script>
</body>
</html>
